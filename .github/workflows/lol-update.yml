name: LoL - actualizar datos de OP.GG
on:
  schedule:
    - cron: "17 5 * * *"   # cada día ~6:17 (hora peninsular); solo descarga todo si hay parche nuevo o los datos tienen 3+ días
  workflow_dispatch:
    inputs:
      force: { description: "Forzar actualización completa", type: boolean, default: false }
  push:
    paths: ["lol/scripts/update.mjs", "lol/scripts/mcp.mjs", "lol/scripts/toon.mjs", ".github/workflows/lol-update.yml"]
permissions:
  contents: write
concurrency: { group: lol-update, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node lol/scripts/update.mjs ${{ github.event_name == 'push' && '--force --limit=4' || (inputs.force && '--force' || '') }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add lol/data
          git commit -q -m "lol: datos de OP.GG actualizados" || { echo "sin cambios"; exit 0; }
          git pull -q --rebase origin main && git push
