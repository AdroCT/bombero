<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Counters LoL">
<meta name="theme-color" content="#0b1016">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Counters LoL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Una columna tipo app (máx. 760px), tema oscuro hextech: azul noche, oro y cian. */
:root{
  --bg:#0b1016; --panel:#121a23; --panel2:#18232f; --line:#24313f; --ink:#e9e4d6; --muted:#8e9aa6;
  --gold:#c8aa6e; --gold2:#f0e6d2; --cyan:#0ac8b9; --good:#3fc48a; --bad:#e8546b; --warn:#e9b44c;
  --display:"Cinzel",Georgia,serif; --cond:"Barlow Condensed","Arial Narrow",sans-serif; --body:"Barlow",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font:inherit;color:inherit;cursor:pointer}
img{max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(var(--bg),rgba(11,16,22,.94));backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:54px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.top h1{flex:1;min-width:0;margin:0;font-family:var(--display);font-size:20px;color:var(--gold2);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.patch{font-family:var(--cond);font-size:13px;letter-spacing:.06em;color:var(--bg);background:var(--gold);padding:2px 8px;border-radius:4px;white-space:nowrap}
.iconbtn{border:0;background:transparent;width:40px;height:40px;border-radius:8px;display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-family:var(--cond);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.muted{color:var(--muted)} .small{font-size:14px}
.lanes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lane{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 4px;font-family:var(--cond);font-weight:700;letter-spacing:.04em;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:4px}
.lane svg{width:24px;height:24px}
.lane[aria-pressed="true"]{border-color:var(--gold);background:linear-gradient(180deg,#2a2416,var(--panel));color:var(--gold2)}
.lane:disabled{opacity:.3;cursor:default}
.search{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.search:focus{outline:none;border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:10px}
.ch{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.ch img,.ch .ph{width:60px;height:60px;border-radius:6px;border:2px solid var(--line);background:var(--panel2)}
.ch span{font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.ch.sel img{border-color:var(--gold)}
.hero{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.hero img{width:72px;height:72px;border-radius:8px;border:2px solid var(--gold);flex:none}
.hero h2{margin:0;font-family:var(--display);font-size:24px;color:var(--gold2);line-height:1.1}
.hero .sub{font-size:14px;color:var(--muted)}
.tier{display:inline-block;font-family:var(--cond);font-weight:700;font-size:13px;padding:1px 7px;border-radius:4px;background:var(--panel2);border:1px solid var(--line)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;width:100%}
.row:first-child{border-top:0}
.row:active{background:var(--panel2)}
.row img{width:44px;height:44px;border-radius:6px;flex:none;border:1px solid var(--line)}
.row .txt{flex:1;min-width:0}
.row .txt b{display:block;font-size:16px}
.row .txt small{color:var(--muted);font-size:13px}
.wr{font-family:var(--cond);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;text-align:right;line-height:1}
.wr small{display:block;font-family:var(--body);font-weight:500;font-size:11px;color:var(--muted)}
.good{color:var(--good)} .bad{color:var(--bad)}
.meter{height:5px;border-radius:3px;background:var(--panel2);overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:var(--bad)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:radial-gradient(ellipse at center,#1d2a36,var(--panel));border:1px solid var(--line);border-radius:12px;padding:14px}
.vs .side{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;text-align:center}
.vs img{width:68px;height:68px;border-radius:8px;border:2px solid var(--line)}
.vs .me img{border-color:var(--cyan)} .vs .them img{border-color:var(--bad)}
.vs b{font-family:var(--display);font-size:17px;color:var(--gold2)}
.vs .mid{font-family:var(--display);font-size:22px;color:var(--gold)}
.big{font-family:var(--cond);font-weight:700;font-size:30px;line-height:1}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:10px 6px;font-family:var(--cond);font-weight:700;font-size:16px;letter-spacing:.05em;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--gold2);border-bottom-color:var(--gold)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-family:var(--cond);font-size:17px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.items{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.item{display:flex;flex-direction:column;align-items:center;gap:3px;width:62px;text-align:center}
.item img{width:46px;height:46px;border-radius:6px;border:1px solid var(--gold);background:#000}
.item span{font-size:11px;line-height:1.15;color:var(--muted)}
.arrow{color:var(--gold);font-size:18px}
.stat{font-size:13px;color:var(--muted)}
.runes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tree{display:flex;flex-direction:column;gap:8px}
.rune{display:flex;align-items:center;gap:10px}
.rune img{width:34px;height:34px;border-radius:50%;background:#000;border:1px solid var(--line);flex:none}
.rune.key img{width:44px;height:44px;border-color:var(--gold)}
.rune span{font-size:14px}
.skills{overflow-x:auto}
.skills table{border-collapse:separate;border-spacing:2px;font-family:var(--cond);font-weight:700}
.skills td,.skills th{width:20px;height:24px;text-align:center;font-size:14px;border-radius:4px}
.skills th{color:var(--muted);font-weight:600;font-size:12px}
.skills td.k{color:var(--gold2);text-align:left;padding-right:8px;width:auto;white-space:nowrap}
.skills td.on{background:var(--gold);color:var(--bg)}
.skills td.on.r{background:var(--cyan)}
.skills td.off{background:var(--panel2)}
.tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.plan p{margin:0}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.bars{display:flex;gap:6px;align-items:flex-end;height:70px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
.bars i{display:block;width:100%;border-radius:3px 3px 0 0;background:var(--cyan)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.foot{font-size:12px;color:var(--muted);text-align:center;line-height:1.5}
.btn{border:1px solid var(--gold);background:transparent;color:var(--gold2);border-radius:8px;padding:10px 14px;font-family:var(--cond);font-weight:700;letter-spacing:.05em;font-size:16px}
@media (max-width:420px){.runes{grid-template-columns:1fr}.lane{font-size:13px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="in" id="topbar"></div></header>
<main class="wrap" id="app"><div class="empty">Cargando datos del parche…</div></main>
<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const strip = s => String(s || "").replace(/<br\s*\/?>/gi, " ").replace(/<[^>]+>/g, "").replace(/\s+/g, " ").trim();
const pct = x => x == null ? "–" : (x * 100).toFixed(1).replace(".", ",") + " %";
const POS = [["top","Top"],["jungle","Jungla"],["mid","Mid"],["adc","ADC"],["support","Support"]];
const POSN = Object.fromEntries(POS);
const LANE_ICON = {
  top:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V4h16"/><rect x="4" y="4" width="7" height="7" fill="currentColor" stroke="none" opacity=".5"/></svg>',
  jungle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3c-3 4-6 6-6 10a6 6 0 0 0 12 0c0-4-3-6-6-10z"/></svg>',
  mid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M6 18L18 6"/></svg>',
  adc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 4v16H4"/><rect x="13" y="13" width="7" height="7" fill="currentColor" stroke="none" opacity=".5"/></svg>',
  support:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l3 5h5l-4 4 1.5 6L12 15l-5.5 3L8 12 4 8h5z"/></svg>'
};
let M = null, TIPS = null, KITS = {}, ITEMS = {}, GUIDES = {}, CH = {}, cache = {};
const DD = () => `https://ddragon.leagueoflegends.com/cdn/${M.ddragon}`;
const champImg = id => `${DD()}/img/champion/${CH[id].key}.png`;
const itemImg = id => `${DD()}/img/item/${id}.png`;
const runeImg = id => M.runes[id] ? `https://ddragon.leagueoflegends.com/cdn/img/${M.runes[id].i}` : "";
const spellOf = id => M.spells[id] || { n: "Hechizo " + id, img: "" };
function ls(k, v){ try{ if(v === undefined){ const s = localStorage.getItem(k); return s ? JSON.parse(s) : null; } localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null; } }

/* ---------- navegación por hash: #c-<id>-<pos> y #v-<id>-<pos>-<counterId> ---------- */
function parseHash(){ const h = location.hash.slice(1).split("-"); if(h[0] === "c" && CH[h[1]]) return { name:"champ", id:+h[1], pos:h[2] }; if(h[0] === "v" && CH[h[1]] && CH[h[3]]) return { name:"vs", id:+h[1], pos:h[2], cid:+h[3], tab:"plan" }; return { name:"home" }; }
let view = { name:"home" };
function go(hash){ if(location.hash === "#" + hash) render(); else location.hash = hash; }
window.addEventListener("hashchange", () => { view = parseHash(); render(); window.scrollTo(0, 0); });
function topbar(title, back){
  $("#topbar").innerHTML = `${back ? `<button class="iconbtn" id="back" aria-label="Volver"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>` : ""}<h1>${esc(title)}</h1><span class="patch" title="Parche de las estadísticas de OP.GG">Parche ${esc(M.patch)}</span>`;
  if(back) $("#back").onclick = () => history.length > 1 ? history.back() : go("");
}
function render(){ ({ home, champ, vs })[view.name](); }

/* ---------- inicio: elige campeón y línea ---------- */
let pick = ls("lol-pick") || { id:null, pos:null, q:"" };
function home(){
  topbar("Counters LoL");
  const sel = pick.id && CH[pick.id];
  const lanes = POS.map(([p, n]) => { const ok = !sel || CH[pick.id].positions.some(x => x.pos === p); return `<button class="lane" data-pos="${p}" aria-pressed="${pick.pos === p}" ${ok ? "" : "disabled"}>${LANE_ICON[p]}${n}</button>`; }).join("");
  $("#app").innerHTML = `
    <div class="eyebrow">1 · Línea</div>
    <div class="lanes">${lanes}</div>
    <div class="eyebrow">2 · Campeón rival</div>
    <input class="search" id="q" type="search" placeholder="Busca un campeón…" value="${esc(pick.q || "")}" autocomplete="off" aria-label="Buscar campeón">
    <div class="grid" id="grid"></div>
    <p class="foot">Datos de ${esc(M.source)}. Actualizado el ${new Date(M.updated).toLocaleString("es-ES",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}. Se renueva solo cada día y con cada parche.</p>`;
  const draw = () => {
    const n = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
    const q = n(pick.q || "");
    const list = M.champs.filter(c => c.positions.length && (!q || n(c.name).includes(q) || n(c.en).includes(q)) && (!pick.pos || c.positions.some(x => x.pos === pick.pos)))
      .sort((a, b) => a.name.localeCompare(b.name, "es"));
    $("#grid").innerHTML = list.length ? list.map(c => `<button class="ch ${pick.id === c.id ? "sel" : ""}" data-id="${c.id}"><img loading="lazy" src="${champImg(c.id)}" alt=""><span>${esc(c.name)}</span></button>`).join("") : `<div class="empty" style="grid-column:1/-1">Ningún campeón con ese nombre${pick.pos ? " en " + POSN[pick.pos] : ""}.</div>`;
    document.querySelectorAll(".ch").forEach(b => b.onclick = () => {
      const c = CH[b.dataset.id]; pick.id = c.id;
      let pos = pick.pos && c.positions.some(x => x.pos === pick.pos) ? pick.pos : [...c.positions].sort((a,b) => b.games - a.games)[0].pos;
      pick.pos = pos; ls("lol-pick", pick); go(`c-${c.id}-${pos}`);
    });
  };
  draw();
  $("#q").oninput = e => { pick.q = e.target.value; ls("lol-pick", pick); draw(); };
  document.querySelectorAll(".lane").forEach(b => b.onclick = () => { pick.pos = pick.pos === b.dataset.pos ? null : b.dataset.pos; ls("lol-pick", pick); home(); });
}

async function loadM(id, pos){
  const k = pos + "/" + id; if(cache[k]) return cache[k];
  const r = await fetch(`data/m/${pos}/${id}.json`); if(!r.ok) throw new Error("sin datos");
  return cache[k] = await r.json();
}

/* ---------- campeón + línea: sus counters ---------- */
async function champ(){
  const c = CH[view.id], pos = view.pos, P = c.positions.find(x => x.pos === pos);
  topbar(`${c.name} · ${POSN[pos] || pos}`, true);
  pick.id = c.id; pick.pos = pos; ls("lol-pick", pick);
  const others = c.positions.filter(x => x.pos !== pos);
  $("#app").innerHTML = `
    <div class="hero"><img src="${champImg(c.id)}" alt=""><div style="min-width:0">
      <h2>${esc(c.name)}</h2><div class="sub">${esc(POSN[pos])}${P ? ` · <span class="tier">Tier ${P.tier}</span> · ${pct(P.wr)} victorias · ${pct(P.pr)} pick · ${pct(P.br)} ban` : ""}</div>
      ${others.length ? `<div class="small" style="margin-top:6px">También: ${others.map(o => `<a href="#c-${c.id}-${o.pos}" style="color:var(--gold)">${POSN[o.pos]}</a>`).join(" · ")}</div>` : ""}
    </div></div>
    <div id="body"><div class="empty">Cargando counters…</div></div>`;
  let d; try{ d = await loadM(c.id, pos); }catch(e){ $("#body").innerHTML = `<div class="empty">Todavía no hay datos de ${esc(c.name)} en ${esc(POSN[pos])}. Se descargan en la próxima actualización.</div>`; return; }
  const row = (r, isCounter) => { const o = CH[r.id]; if(!o) return ""; const theirWr = 1 - r.myWr;
    return `<button class="row" data-cid="${r.id}" ${isCounter ? "" : "data-easy"}><img loading="lazy" src="${champImg(r.id)}" alt=""><div class="txt"><b>${esc(o.name)}</b><small>${r.g.toLocaleString("es-ES")} partidas${isCounter && d.vs[r.id] ? " · build y plan disponibles" : ""}</small>
      ${isCounter ? `<div class="meter"><i style="width:${Math.min(100, Math.max(4, (theirWr - 0.5) * 1000))}%"></i></div>` : ""}</div>
      <div class="wr ${isCounter ? "bad" : "good"}">${pct(isCounter ? theirWr : r.myWr)}<small>${isCounter ? "gana " + esc(o.name) : "gana " + esc(c.name)}</small></div></button>`; };
  $("#body").innerHTML = `
    <div class="eyebrow">Counters de ${esc(c.name)} · elige uno</div>
    ${d.counters.length ? `<div class="list">${d.counters.filter(r => r.myWr < 0.5).map(r => row(r, true)).join("")}</div>` : `<div class="empty">No hay suficientes partidas para calcular counters fiables.</div>`}
    <p class="small muted" style="margin:0">Porcentaje = victorias del counter contra ${esc(c.name)} en ${esc(POSN[pos])}, según OP.GG (mínimo 150 partidas cuando hay datos suficientes).</p>
    ${d.easy.length ? `<div class="eyebrow">Contra quién gana ${esc(c.name)} (evítalos)</div><div class="list">${d.easy.map(r => row(r, false)).join("")}</div>` : ""}`;
  document.querySelectorAll(".row[data-cid]:not([data-easy])").forEach(b => b.onclick = () => go(`v-${c.id}-${pos}-${b.dataset.cid}`));
  document.querySelectorAll(".row[data-easy]").forEach(b => b.style.cursor = "default");
}

/* ---------- counter elegido: build, runas, habilidades y plan ---------- */
async function vs(){
  const X = CH[view.id], C = CH[view.cid], pos = view.pos;
  topbar(`${C.name} vs ${X.name}`, true);
  let d; try{ d = await loadM(X.id, pos); }catch(e){ $("#app").innerHTML = `<div class="empty">Sin datos para este enfrentamiento.</div>`; return; }
  const gk = pos + "/" + X.id;
  if(!(gk in GUIDES)){ try{ const gr = await fetch(`guides/${pos}/${X.id}.json`); GUIDES[gk] = gr.ok ? await gr.json() : null; }catch(e){ GUIDES[gk] = null; } }
  const r = d.counters.find(x => x.id === C.id) || { myWr: null, g: 0 };
  const G = d.vs[C.id];
  const tab = view.tab || "plan";
  $("#app").innerHTML = `
    <div class="vs"><div class="side me"><img src="${champImg(C.id)}" alt=""><b>${esc(C.name)}</b><span class="chip">Tú</span></div>
      <div class="mid">VS</div>
      <div class="side them"><img src="${champImg(X.id)}" alt=""><b>${esc(X.name)}</b><span class="chip">Rival · ${esc(POSN[pos])}</span></div></div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap">
      <div><span class="big good">${pct(r.myWr == null ? null : 1 - r.myWr)}</span> <span class="muted small">de victorias de ${esc(C.name)} en esta línea</span></div>
      <span class="small muted">${(r.g || 0).toLocaleString("es-ES")} partidas · parche ${esc(d.patch)}</span></div>
    <div class="tabs" role="tablist">${[["plan","Plan"],["build","Build"],["runas","Runas"],["skills","Habilidades"]].map(([k,l]) => `<button role="tab" aria-selected="${tab===k}" data-tab="${k}">${l}</button>`).join("")}</div>
    <div id="tab"></div>`;
  document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { view.tab = b.dataset.tab; vs(); });
  const T = $("#tab");
  if(!G){ T.innerHTML = `<div class="empty">OP.GG no tiene suficientes partidas de este enfrentamiento para dar una build fiable.</div>${planHTML(C, X, null)}`; return; }
  if(tab === "build") T.innerHTML = buildHTML(G, C, X);
  if(tab === "runas") T.innerHTML = runesHTML(G);
  if(tab === "skills") T.innerHTML = skillsHTML(G, C);
  if(tab === "plan") T.innerHTML = planHTML(C, X, G, r);
}
const itemsRow = (b) => `<div class="items">${b.ids.map((id, i) => `${i ? '<span class="arrow">›</span>' : ""}<div class="item"><img loading="lazy" src="${itemImg(id)}" alt=""><span>${esc(b.n[i])}</span></div>`).join("")}</div>`;
const statLine = b => `<div class="stat">${pct(b.wr)} victorias · ${pct(b.pr)} de uso · ${b.g} partidas</div>`;
function buildHTML(G, C, X){
  const block = (title, arr) => arr && arr.length ? `<div class="card"><h3>${title}</h3>${arr.map((b, i) => `<div style="display:flex;flex-direction:column;gap:4px">${i ? '<div class="eyebrow" style="font-size:11px">Alternativa</div>' : ""}${itemsRow(b)}${statLine(b)}</div>`).join("")}</div>` : "";
  const sp = G.spells && G.spells[0];
  return `<div style="display:flex;flex-direction:column;gap:12px">
    ${sp ? `<div class="card"><h3>Hechizos de invocador</h3><div class="items">${sp.ids.map(id => `<div class="item"><img src="${DD()}/img/spell/${spellOf(id).img}" alt=""><span>${esc(spellOf(id).n)}</span></div>`).join("")}</div>${statLine(sp)}</div>` : ""}
    ${block("Objetos iniciales", G.start)}
    ${block("Objetos principales", G.core)}
    ${block("Botas", G.boots)}
    ${G.items && G.items.length ? `<div class="card"><h3>Objetos más comprados contra ${esc(X.name)}</h3><div class="items">${G.items.map(it => `<div class="item"><img loading="lazy" src="${itemImg(it.id)}" alt=""><span>${esc(it.n)}<br>${pct(it.pr)}</span></div>`).join("")}</div></div>` : ""}
    <p class="small muted" style="margin:0">Builds de ${esc(C.name)} en partidas contra ${esc(X.name)} (OP.GG). Con pocas partidas, tómalo como orientación.</p></div>`;
}
function runesHTML(G){
  if(!G.runes || !G.runes.length) return `<div class="empty">Sin datos de runas.</div>`;
  return G.runes.map((R, i) => `<div class="card"><h3>${i ? "Alternativa" : "Página recomendada"}</h3>
    <div class="runes"><div class="tree"><div class="rune"><img src="${runeImg(R.main)}" alt=""><span class="eyebrow" style="font-size:13px">${esc(M.runes[R.main]?.n || "")}</span></div>
      ${R.p.map((id, k) => `<div class="rune ${k === 0 ? "key" : ""}"><img loading="lazy" src="${runeImg(id)}" alt=""><span>${esc(M.runes[id]?.n || id)}</span></div>`).join("")}</div>
    <div class="tree"><div class="rune"><img src="${runeImg(R.sub)}" alt=""><span class="eyebrow" style="font-size:13px">${esc(M.runes[R.sub]?.n || "")}</span></div>
      ${R.s.map(id => `<div class="rune"><img loading="lazy" src="${runeImg(id)}" alt=""><span>${esc(M.runes[id]?.n || id)}</span></div>`).join("")}
      <div class="small muted">Fragmentos: ${R.m.map(id => esc(M.shards[id] || id)).join(" · ")}</div></div></div>
    ${statLine(R)}</div>`).join("");
}
function skillsHTML(G, C){
  const t = TIPS[C.id], S = G.skills;
  if(!S) return `<div class="empty">Sin datos de habilidades.</div>`;
  const name = k => t?.spells?.find(s => s.k === k)?.n || "";
  const rows = ["Q","W","E","R"].map(k => `<tr><td class="k">${k}</td>${S.o.map(x => `<td class="${x === k ? "on" + (k === "R" ? " r" : "") : "off"}">${x === k ? k : ""}</td>`).join("")}</tr>`).join("");
  return `<div class="card"><h3>Orden de subida</h3>${G.max ? `<p style="margin:0">Maximiza: <b style="color:var(--gold2)">${G.max.join(" › ")}</b></p>` : ""}
    <div class="skills"><table><tr><th></th>${S.o.map((_, i) => `<th>${i + 1}</th>`).join("")}</tr>${rows}</table></div>
    <div class="small muted">${["Q","W","E","R"].map(k => `<b style="color:var(--gold2)">${k}</b> ${esc(name(k))}`).join(" · ")}</div>
    <div class="stat">${pct(S.wr)} victorias · ${S.g} partidas</div></div>`;
}
/* ---------- plan: guía experta + datos exactos del enfrentamiento ---------- */
const statAt = (base, g, lvl) => base + g * (lvl - 1) * (0.7025 + 0.0175 * (lvl - 1));
const fmtN = x => (Math.round(x * 10) / 10).toLocaleString("es-ES");
function guideHTML(G0){
  if(!G0) return "";
  const list = (t, arr) => arr && arr.length ? `<div class="card plan"><h3>${t}</h3><ul class="tips">${arr.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : "";
  const dcol = { "fácil":"var(--good)", "media":"var(--warn)", "difícil":"var(--bad)" }[G0.dificultad] || "var(--muted)";
  return `<div class="card plan" style="border-color:var(--gold)"><h3>Resumen del enfrentamiento <span class="chip" style="color:${dcol};border-color:${dcol};margin-left:6px">Dificultad ${esc(G0.dificultad || "")}</span></h3><p>${esc(G0.resumen)}</p></div>
    ${(G0.fases || []).map(f => list(esc(f.t), f.p)).join("")}
    ${list("Trades y combos", G0.trades)}
    ${list("Qué respetar y errores típicos", G0.evitar)}
    ${list("Gestión de oleadas", G0.oleadas)}
    ${list("Jungla, roams y visión", G0.jungla)}
    ${list("Por qué esta build", G0.build)}
    ${G0.late ? `<div class="card plan"><h3>Después de la línea</h3><p>${esc(G0.late)}</p></div>` : ""}`;
}
function statsHTML(C, X){
  const a = KITS[C.id]?.stats, b = KITS[X.id]?.stats; if(!a || !b) return "";
  const rows = [
    ["Rango de ataque", a.range, b.range, 0], ["Velocidad de movimiento", a.ms, b.ms, 0],
    ...[1, 6, 11].map(l => [`Vida · nivel ${l}`, statAt(a.hp, a.hpl, l), statAt(b.hp, b.hpl, l), 0]),
    ...[1, 6, 11].map(l => [`Armadura · nivel ${l}`, statAt(a.ar, a.arl, l), statAt(b.ar, b.arl, l), 0]),
    ...[1, 6, 11].map(l => [`Resist. mágica · nivel ${l}`, statAt(a.mr, a.mrl, l), statAt(b.mr, b.mrl, l), 0]),
    ...[1, 6].map(l => [`Daño de ataque · nivel ${l}`, statAt(a.ad, a.adl, l), statAt(b.ad, b.adl, l), 0])
  ];
  const cell = (v, o) => { const d = v - o; return `<td style="text-align:right;font-variant-numeric:tabular-nums;${Math.abs(d) > 0.5 ? `color:${d > 0 ? "var(--good)" : "var(--bad)"}` : ""}">${fmtN(v)}</td>`; };
  return `<div class="card"><h3>Estadísticas base comparadas</h3><div class="skills"><table style="border-spacing:0 2px;width:100%;font-family:var(--body);font-weight:500">
    <tr><th style="text-align:left;width:auto">Sin objetos ni runas</th><th style="width:auto;text-align:right;color:var(--cyan)">${esc(C.name)}</th><th style="width:auto;text-align:right;color:var(--bad)">${esc(X.name)}</th></tr>
    ${rows.map(([n, v, o]) => `<tr><td style="text-align:left;color:var(--muted);height:auto;width:auto">${n}</td>${cell(v, o)}${cell(o, v)}</tr>`).join("")}</table></div>
    <p class="small muted" style="margin:0">${a.range > b.range + 25 ? `Tienes <b>${a.range - b.range}</b> unidades más de rango: castiga cuando ${esc(X.name)} se acerque a farmear.` : b.range > a.range + 25 ? `${esc(X.name)} tiene <b>${b.range - a.range}</b> unidades más de rango: no regales trades de ataques básicos gratis.` : "Rangos de ataque parecidos."} ${a.ms !== b.ms ? `Velocidad: ${a.ms > b.ms ? "tú eres" : "el rival es"} ${Math.abs(a.ms - b.ms)} más rápido sin botas.` : ""}</p></div>`;
}
function cdHTML(C, X){
  const row = (ch, col) => (KITS[ch.id]?.spells || []).map(s => `<tr><td class="k" style="color:${col}">${s.k}</td><td style="text-align:left;width:auto;font-family:var(--body);font-weight:500;color:var(--ink);padding-right:8px">${esc(s.n)}</td><td style="width:auto;text-align:left;font-variant-numeric:tabular-nums;color:var(--muted)">${esc((s.cd || []).join(" / "))} s</td></tr>`).join("");
  return `<div class="card"><h3>Enfriamientos por rango</h3><div class="skills"><table style="border-spacing:2px 4px">
    <tr><th colspan="3" style="text-align:left;color:var(--cyan)">${esc(C.name)} (tú)</th></tr>${row(C, "var(--cyan)")}
    <tr><th colspan="3" style="text-align:left;color:var(--bad);padding-top:8px">${esc(X.name)}</th></tr>${row(X, "var(--bad)")}</table></div>
    <p class="small muted" style="margin:0">Sin aceleración de habilidades. Úsalo para contar ventanas: si ${esc(X.name)} gasta una habilidad larga, tienes ese tiempo para entrar.</p></div>`;
}
function spikesHTML(C, G){
  if(!G || !G.core || !G.core[0]) return "";
  const path = [...(G.core[0].ids || [])];
  let acc = 0;
  const lines = path.map((id, i) => { const it = ITEMS[id]; const g = it ? it.g : null; if(g) acc += g; return `<li><b>${esc(G.core[0].n[i])}</b>${g ? ` · ${g.toLocaleString("es-ES")} de oro (acumulado ${acc.toLocaleString("es-ES")})` : ""}${it && it.d ? ` <span class="muted">— ${esc(it.d)}</span>` : ""}</li>`; }).join("");
  const boots = G.boots && G.boots[0] && ITEMS[G.boots[0].ids[0]];
  return `<div class="card"><h3>Picos de poder por objetos</h3><ul class="tips">${lines}</ul>
    ${boots ? `<p class="small muted" style="margin:0">Botas habituales: ${esc(G.boots[0].n[0])} (${boots.g.toLocaleString("es-ES")} de oro, ${pct(G.boots[0].pr)} de uso).</p>` : ""}
    <p class="small muted" style="margin:0">Niveles clave: 2 (segunda habilidad), 3, 6 (definitiva), 11 y 16 (rangos de definitiva). Cuenta oleadas: el nivel 2 llega con la primera oleada + 3 súbditos cuerpo a cuerpo de la segunda.</p></div>`;
}
function planHTML(C, X, G, r){
  const tc = KITS[C.id] || TIPS[C.id] || {}, tx = KITS[X.id] || TIPS[X.id] || {};
  const G0 = GUIDES[view.pos + "/" + X.id]?.[C.id];
  const parts = [];
  if(G0) parts.push(guideHTML(G0));
  else parts.push(`<div class="card plan"><h3>Guía del enfrentamiento</h3><p class="small muted">Todavía no hay guía escrita para este enfrentamiento; abajo tienes los datos exactos para prepararlo.</p></div>`);
  parts.push(`<div class="eyebrow" style="margin-top:6px">Datos exactos del enfrentamiento</div>`);
  parts.push(statsHTML(C, X), cdHTML(C, X), spikesHTML(C, G));
  if(G && G.len && G.len.length > 1){
    const lab = ["<25′","25-30′","30-35′","35-40′","40′+"];
    const max = Math.max(...G.len.map(x => x.wr || 0)), min = Math.min(...G.len.map(x => x.wr || 1));
    parts.push(`<div class="card plan"><h3>Victorias de ${esc(C.name)} según duración de la partida</h3><p class="small muted" style="margin:0">Todas sus partidas en esta línea, no solo contra ${esc(X.name)}: indica si escala o si gana pronto.</p>
      <div class="bars">${G.len.map((x, i) => `<div><span>${pct(x.wr)}</span><i style="height:${10 + ((x.wr - min) / Math.max(0.001, max - min)) * 40}px"></i><span>${lab[i] || ""}</span></div>`).join("")}</div></div>`);
  }
  if(tx.passive) parts.push(`<div class="card plan"><h3>Pasiva de ${esc(X.name)}: ${esc(tx.passive.n)}</h3><p class="small">${esc(strip(tx.passive.d))}</p></div>`);
  const riot = [...(tc.ally || []).map(t => `<li>${esc(strip(t))}</li>`)].join(""), riot2 = [...(tx.enemy || []).map(t => `<li>${esc(strip(t))}</li>`)].join("");
  if(riot || riot2) parts.push(`<details class="card"><summary style="cursor:pointer;font-family:var(--cond);font-weight:700;letter-spacing:.06em;color:var(--gold)">CONSEJOS OFICIALES DE RIOT</summary>${riot ? `<p class="small" style="margin:8px 0 4px"><b>Con ${esc(C.name)}</b></p><ul class="tips small">${riot}</ul>` : ""}${riot2 ? `<p class="small" style="margin:8px 0 4px"><b>Contra ${esc(X.name)}</b></p><ul class="tips small">${riot2}</ul>` : ""}</details>`);
  return `<div style="display:flex;flex-direction:column;gap:12px">${parts.join("")}
    <p class="small muted" style="margin:0">Guía redactada a partir del kit oficial actual (Riot, parche ${esc(M.patch)}) y de las estadísticas de OP.GG de este enfrentamiento.</p></div>`;
}

/* ---------- arranque ---------- */
(async () => {
  try{
    const [m, t, k, it] = await Promise.all(["data/meta.json", "data/tips.json", "data/kits.json", "data/items.json"].map(u => fetch(u).then(r => r.ok ? r.json() : {}).catch(() => ({}))));
    M = m; TIPS = t; KITS = k.kits || {}; ITEMS = it; M.champs.forEach(c => CH[c.id] = c);
  }catch(e){ $("#app").innerHTML = `<div class="empty">No se han podido cargar los datos. Comprueba la conexión y recarga.</div>`; return; }
  view = parseHash(); render();
})();
if("serviceWorker" in navigator){ window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {})); }
</script>
</body>
</html>
